[package]
name = "falcon-finch"
version = "0.6.0"
authors = [ "Alex Eubanks <endeavor@rainbowsandpwnies.com>" ]
repository = "https://github.com/falconre/finch"
description = "Symbolic Execution against Falcon IL"
license = "Apache-2.0"
readme = "README.md"
edition = "2018"

[dependencies]
byteorder = "1.5"
clap = "4"
error-chain = "0.12"
falcon = "0.6.0"
falcon-z3 = "0.6.0"
goblin = "0.10"
lazy_static = "1.5"
log = "0.4"
nom = "8"
rustyline = "17"
serde = "1.0"
serde_derive = "1.0"
simplelog = "0.12"

[lib]
name = "finch"
path = "lib/lib.rs"

[[bin]]
name = "finch-bin"
path = "src/main.rs"

[features]
thread_safe = ["falcon/thread_safe"]

[profile.release]
debug = 2
